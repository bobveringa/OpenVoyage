version: '3.8'

services:
  postgres:
    image: postgis/postgis:18-3.6
    container_name: travelblog-db
    environment:
      POSTGRES_USER: travelblog_user
      POSTGRES_PASSWORD: travelblog_password
      POSTGRES_DB: travelblog_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelblog_user -d travelblog_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
