name: Set up the frontend toolchain
description: >-
  Installs the Node version this project builds with and the frontend npm
  dependencies, so every job that touches frontend/ agrees on both.

inputs:
  node-version:
    description: Node major version to install.
    required: false
    default: '22'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Install frontend dependencies
      shell: bash
      working-directory: frontend
      run: npm ci
