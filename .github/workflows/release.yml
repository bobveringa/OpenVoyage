name: Release

# One workflow owns everything that leaves the repository:
#   push to main       -> ghcr.io/.../openvoyage:edge, :main, :sha-<short>
#   tag v1.2.3         -> :1.2.3, :1.2, :latest  + an Android APK artifact
#   tag v1.2.3-rc1     -> :1.2.3-rc1 only; prereleases never move :latest
#   manual dispatch    -> :<branch name>, for trying a build before tagging
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  # Never cancel a half-finished publish; a partially pushed tag is worse
  # than a queued run.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  image:
    name: Publish container image
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Work out the image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Spelled out rather than github.repository because GHCR rejects
          # the capital letters in the repository name.
          images: ghcr.io/${{ github.repository_owner }}/openvoyage
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Shared with the pull-request build in ci.yml, so a merge usually
          # only rebuilds the layers the pull request actually changed.
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summarise what was published
        run: |
          {
            echo '### Published images'
            echo
            echo '```'
            echo '${{ steps.meta.outputs.tags }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  android:
    name: Build Android APK
    needs: checks
    # Only worth the Gradle run for something releasable, or when asked for
    # explicitly.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # This project's Gradle wrapper (8.14.x) does not run on JDK 25+.
          java-version: '21'
          cache: gradle
      - uses: ./.github/actions/setup-frontend
      - name: Build the APK
        working-directory: frontend
        # Builds the web bundle, syncs it into the Capacitor project and runs
        # assembleDebug — the same command used locally.
        run: npm run android:apk
      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          # Debug-signed: android/app/build.gradle has no release signing
          # config, so this installs on a device but cannot go to a store.
          name: openvoyage-android-${{ github.ref_name }}-debug
          if-no-files-found: error
          retention-days: 30
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
