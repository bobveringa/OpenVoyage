services:
  app:
    # Published by .github/workflows/release.yml on every release tag.
    # Override OPENVOYAGE_IMAGE in .env to pin a version (":1.2.3"), track a
    # release candidate (":1.2.3-rc1"), follow main (":edge"), or point at an
    # image you built yourself with "docker build --tag openvoyage:local .".
    image: ${OPENVOYAGE_IMAGE:-ghcr.io/bobveringa/openvoyage:latest}
    env_file: .env
    environment:
      POSTGRES_SERVER: postgres
      FRONTEND_DIST_DIRECTORY: /app/frontend-dist
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
